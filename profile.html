
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Renu General Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-container { max-width: 600px; margin: 40px auto; padding: 30px; background: #fff; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,.08); text-align: center; }
        .profile-avatar { font-size: 60px; color: #ff4757; margin-bottom: 15px; }
        .profile-info { margin: 20px 0; text-align: left; background: #f9f9f9; padding: 15px 20px; border-radius: 10px; }
        .profile-info p { margin: 10px 0; font-size: 16px; color: #333; }
        .logout-btn { background: #ff4757; color: #fff; padding: 12px 25px; border-radius: 30px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 15px; }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="header">
        <div class="container nav">
            <a href="index.html" class="logo"><span>🛒</span>Renu General Store</a>
            <a href="index.html" class="cart-btn"><i class="fas fa-home"></i> Home</a>
        </div>
    </header>

    <!-- Profile Section -->
    <section style="padding-top: 130px; padding-bottom: 50px;">
        <div class="container">
            <div class="profile-container">
                <div class="profile-avatar">
                    <i class="fas fa-user-circle"></i>
                </div>
                <h2>Aapki Profile</h2>
                <p style="color: #666; margin-bottom: 20px;">Aapki account details niche di gayi hain</p>
                
                <div class="profile-info">
                    <p><strong>Naam:</strong> <span id="user-name">Guest User</span></p>
                    <p><strong>Mobile:</strong> <span id="user-phone">Not Logged In</span></p>
                </div>

                <a href="login.html" class="logout-btn" id="auth-action-btn"><i class="fas fa-sign-in-alt"></i> Login Karein</a>
            </div>
        </div>
    </section>

</body>
</html>
