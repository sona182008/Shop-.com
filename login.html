<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Renu General Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="header">
        <div class="container nav">
            <a href="index.html" class="logo"><span>🛒</span>Renu General Store</a>
            <a href="index.html" class="cart-btn"><i class="fas fa-home"></i> Home</a>
        </div>
    </header>

    <!-- Login Form Section -->
    <section class="products" style="padding-top: 150px; text-align: center;">
        <div class="section-title">
            <h2>Login Karein</h2>
            <p>Apna mobile number daal kar login karein.</p>
        </div>
        <div style="max-width: 400px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,.08);">
            <input type="tel" placeholder="Mobile Number" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px;">
            <a href="index.html" class="order-btn" style="display: block; width: 100%;">OTP Bhejein</a>
        </div>
    </section>

</body>
</html>
