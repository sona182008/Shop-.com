<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Renu General Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .cart-container { max-width: 800px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,.08); }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 15px 0; }
        .cart-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; }
        .cart-summary { margin-top: 20px; text-align: right; }
        .checkout-btn { background: #25D366; color: #fff; padding: 12px 30px; border-radius: 30px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 15px; }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="header">
        <div class="container nav">
            <a href="index.html" class="logo"><span>🛒</span>Renu General Store</a>
            <a href="index.html" class="cart-btn"><i class="fas fa-home"></i> Home</a>
        </div>
    </header>

    <!-- Cart Section -->
    <section style="padding-top: 130px; padding-bottom: 50px;">
        <div class="container">
            <div class="section-title">
                <h2>Aapka Shopping Cart</h2>
                <p>Aapke selected items ki list niche hai</p>
            </div>
            
            <div class="cart-container">
                <div id="cart-items-list">
                    <p style="text-align: center; color: #666;">Aapka cart filhal khali hai.</p>
                </div>
                
                <div class="cart-summary" id="cart-summary-box" style="display: none;">
                    <h3>Total: <span id="total-price">₹0</span></h3>
                    <a href="#" class="checkout-btn" id="whatsapp-checkout"><i class="fab fa-whatsapp"></i> WhatsApp par Order bhejein</a>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
